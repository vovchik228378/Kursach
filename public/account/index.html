<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МояКарта - Личный кабинет</title>
    <link rel="stylesheet" href="/styles/main.css">
    <script src="https://api-maps.yandex.ru/2.1/?apikey=7177144e-52fd-4848-8122-eed8ecb9c686&lang=ru_RU" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
    <script src="/supabase-client.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <div class="top-bar">
        <button class="buttonmain" onclick="window.location.href='/'">МояКарта</button>
        <div class="user-info">
            <span id="usernameDisplay" style="color: white; margin-right: 15px;">Загрузка...</span>
            <button class="button" id="logoutButton">Выход</button>
        </div>
    </div>
    <div class="container">
        <section class="map-section">
            <h2 id="mapTitle">Моя карта</h2>
            <div id="map" style="width: 100%; height: 600px;">
                <div id="map-loading" style="text-align: center; padding-top: 50px;">Загрузка карты...</div>
            </div>
            <div id="addMarkerInfo" style="margin-top: 15px; text-align: center; display: none;">
                Кликните на карту, чтобы добавить новую метку.
            </div>
        </section>
    </div>

</body>

</html>
