<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/auth.css">
    <title>Вход - МояКарта</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
    <script src="/supabase-client.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <button class="buttonmain" onclick="window.location.href='/'">
             МояКарта
        </button>
    </div>

    <div class="container auth-container">
        <h1 class="h1">Вход в аккаунт</h1>

        <form id="loginForm" class="login-form">
            <div id="errorMessage" class="error-message" style="display: none; color: red; margin-bottom: 15px;"></div>
            <div class="input-group">
                <label for="email" class="username-label">Электронная почта:</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="input-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="button" id="loginButton">Войти</button>
        </form>
        <div class="form-footer">
            Нет аккаунта? <a href="/registr/">Зарегистрироваться</a>
        </div>
    </div>

</body>

</html>
